version: '3.8'

services:
  # -------------------------------------------------------------
  # PostgreSQL Database Container
  # -------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: zovo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: zovo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zovo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # FastAPI Backend API Service
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zovo-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/zovo_db
      SECRET_KEY: zovo-super-secret-jwt-key-change-in-production-2026-secure
      ADMIN_EMAIL: admin@zovo.digital
      ADMIN_INITIAL_PASSWORD: ZovoAdmin2026!Secure
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","https://zovo.digital"]'
      EMAIL_PROVIDER: console
      WHATSAPP_NUMBER: "+919876543210"
      SITE_URL: "http://localhost:3000"
    depends_on:
      db:
        condition: service_healthy

  # -------------------------------------------------------------
  # Next.js 16+ Frontend Web Application
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zovo-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_WHATSAPP_NUMBER: "+919876543210"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
